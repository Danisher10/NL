<script>
'use strict';
/* ============ Constants ============ */
const VAULTS = 12, ITER = 600000, CHUNK = 4 * 1024 * 1024;
const LOCK_MS = 60 * 60 * 1000, MAX_FAILS = 3, IDLE_MS = 5 * 60 * 1000;
const COLORS = ['#e53935','#fb8c00','#fdd835','#c0ca33','#43a047','#00897b','#00acc1','#1e88e5','#3949ab','#8e24aa',

const enc = new TextEncoder();
const VAULT_SVG = '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="7" y="9" width="34" height="28" rx="4"/><circle cx="24" cy="23" r="8"/><circle cx="24" cy="23" r="1.5" fill="#fff" stroke="none"/><path d="M11 15v4M11 27v4M13 37v3M35 37v3"/></svg>';

const LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const FILE = '<svg viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>';
const NOTE = '<svg viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.6" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>';
const PLAY = '<svg class="play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,.6)"/><path d="M10 8l6 4-6 4z" fill="#fff"/></svg>';

/* ============ Storage (IndexedDB) ============ */
let dbP;
function db() {
  if (!dbP) dbP = new Promise((res, rej) => {
    const r = indexedDB.open('nella', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('vaults', { keyPath: 'id' });
      d.createObjectStore('locks', { keyPath: 'id' });
      d.createObjectStore('sys', { keyPath: 'k' });
      d.createObjectStore('items', { keyPath: 'id' }).createIndex('vault', 'vault');
      d.createObjectStore('chunks', { keyPath: ['item', 'n'] });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbP;
}
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const done = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = t.onabort = () => rej(t.error); });
async function get(s, k) { const d = await db(); return rq(d.transaction(s).objectStore(s).get(k)); }
async function put(s, v) { const d = await db(); const t = d.transaction(s, 'readwrite'); t.objectStore(s).put(v); return done(t); }
async function del(s, k) { const d = await db(); const t = d.transaction(s, 'readwrite'); t.objectStore(s).delete(k); return done(t); }
async function itemsOf(v) { const d = await db(); return rq(d.transaction('items').objectStore('items').index('vault').getAll(v)); }
async function delItem(id) {
  const d = await db(); const t = d.transaction(['items', 'chunks'], 'readwrite');
  t.objectStore('items').delete(id);
  t.objectStore('chunks').delete(IDBKeyRange.bound([id, 0], [id, Infinity]));
  return done(t);
}

/* ============ Crypto ============ */
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const hex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
const uid = () => hex(rnd(16));
async function pbkdf(str, salt, label) {
  const k = await crypto.subtle.importKey('raw', enc.encode(str), 'PBKDF2', false, ['deriveBits']);
  const s = new Uint8Array([...salt, ...enc.encode(label)]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: s, iterations: ITER }, k, 256));
}
const sha = async b => new Uint8Array(await crypto.subtle.digest('SHA-256', b));
function same(a, b) { if (!a || !b || a.length !== b.length) return false; let x = 0; for (let i = 0; i < a.length; i++) x |= a[i] ^ b[i]; return x === 0; }
const aes = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
async function seal(key, data, aad) {
  const iv = rnd(12);
  const c = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: enc.encode(aad) }, key, data));
  return { iv, c };
}
async function unseal(key, iv, c, aad) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv, additionalData: enc.encode(aad) }, key, c));
}
// Each stage input includes everything before it, so later stages can't be attacked on their own.
const seedStr = w => w.map(x => x.toLowerCase()).join(' ');
const k1 = seed => 'nella1|' + seed;
const k2 = (seed, ps) => k1(seed) + '|' + ps.length + '|' + ps.map(p => p.length + ':' + p.normalize('NFC')).join('|');
const k3 = (seed, ps, cs) => k2(seed, ps) + '|' + cs.length + ':' + cs.join(',');

async function createVault(id, words, ps, cs) {
  const seed = seedStr(words), salt = rnd(16);
  const b1 = await pbkdf(k1(seed), salt, 'stage1');
  const b2 = await pbkdf(k2(seed, ps), salt, 'stage2');
  const b3 = await pbkdf(k3(seed, ps, cs), salt, 'stage3');
  const kek = await aes(b3);
  const dekRaw = rnd(32);
  const w = await seal(kek, dekRaw, 'dek|' + id);
  await put('vaults', { id, ver: 1, salt, v1: await sha(b1), v2: await sha(b2), wiv: w.iv, wc: w.c, created: Date.now() });

  dekRaw.fill(0); b1.fill(0); b2.fill(0); b3.fill(0);
  return key;
}

/* ============ Lockout ============ */
async function clockCheck() {
  const now = Date.now(); const c = await get('sys', 'clock'); const last = c ? c.t : 0;
  if (last && now < last - 2000) {
    // Clock moved backwards: keep the remaining lock time instead of letting it stretch or vanish.
    for (let i = 1; i <= VAULTS; i++) {
      const l = await get('locks', i);
      if (l && l.until > last) { l.until = now + (l.until - last); await put('locks', l); }
    }
  }
  if (!last || now > last || now < last - 2000) await put('sys', { k: 'clock', t: now });
}
async function lockState(id) {
  await clockCheck();
  const l = (await get('locks', id)) || { id, fails: 0, until: 0, pending: false };
  if (l.pending) { l.pending = false; await registerFail(l); }          // app was closed mid-check: counts as a failure
  if (l.until && Date.now() >= l.until) { l.until = 0; l.fails = 0; await put('locks', l); }
  return l;
}
async function registerFail(l) {
  l.fails = (l.fails || 0) + 1; l.pending = false;
  if (l.fails >= MAX_FAILS) { l.until = Date.now() + LOCK_MS; l.fails = 0; }
  await put('locks', l);
  return l;
}
async function beginCheck(id) { const l = await lockState(id); if (l.until > Date.now()) return null; l.pending = true; await put('locks', l); return l; }
async function passCheck(l) { l.pending = false; await put('locks', l); }
async function failCheck(l) { return registerFail(l); }
async function resetFails(id) { await put('locks', { id, fails: 0, until: 0, pending: false }); }

/* ============ UI helpers ============ */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let timers = [];
function view(html) { timers.forEach(clearInterval); timers = []; app.innerHTML = html; window.scrollTo(0, 0); }
function head(step, right = '') { return `<div class="top"><button class="icon-btn" id="back" aria-label="Back">${BACK}</button><div class="step">${step}</div><div style="width:40px;display:flex;justify-content:flex-end">${right}</div></div>`; }
function busy(text) { const b = document.createElement('div'); b.className = 'busy'; b.innerHTML = `<div class="spin"></div><div id="busyT">${esc(text)}</div>`; document.body.appendChild(b); return { set: t => { b.querySelector('#busyT').textContent = t; }, close: () => b.remove() }; }
function modal(html) { const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="sheet">${html}</div>`; document.body.appendChild(m); return m; }
function ask(msg, ok = 'OK') {
  return new Promise(res => {
    const m = modal(`<p>${esc(msg)}</p><button class="btn" data-a="ok">${esc(ok)}</button><button class="btn ghost" data-a="no">Cancel</button>`);
    m.onclick = e => { const a = e.target.closest('[data-a]'); if (!a && e.target !== m) return; m.remove(); res(a && a.dataset.a === 'ok'); };

}
const fmtSize = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';
const fmtDate = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function seg(id, opts, val) { return `<div class="seg" id="${id}">${opts.map(([v, t]) => `<button data-v="${v}" class="${v == val ? 'on' : ''}">${t}</button>`).join('')}</div>`; }
function onSeg(id, fn) { $$('#' + id + ' button').forEach(b => b.onclick = () => fn(+b.dataset.v)); }

/* ============ Shared inputs ============ */
const INP = 'autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore';
function seedHTML(n, vals, hidden) {
  let h = '<div class="words">';
  for (let i = 0; i < n; i++) h += `<label class="word"><i>${i + 1}</i><input class="w ${hidden ? 'hide' : ''}" data-i="${i}" ${INP} enterkeyhint="${i === n - 1 ? 'done' : 'next'}" aria-label="Word ${i + 1}" value="${esc(vals[i] || '')}"></label>`;
  return h + '</div><div class="show"><button class="txt-btn" id="showW">' + (hidden ? 'Show' : 'Hide') + '</button></div>';
}
function wireSeed(onEnter) {
  const ins = $$('input.w');
  ins.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      const v = inp.value;
      const parts = v.trim().split(/\s+/).filter(Boolean);
      if (parts.length > 1) { parts.forEach((p, k) => { if (ins[i + k]) ins[i + k].value = p; }); (ins[Math.min(i + parts.length, ins.length - 1)]).focus(); }
      else if (/\s/.test(v)) { inp.value = v.replace(/\s/g, ''); if (parts.length && ins[i + 1]) ins[i + 1].focus(); }
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (ins[i + 1]) ins[i + 1].focus(); else onEnter(); } });
  });
}
const readSeed = () => $$('input.w').map(x => x.value.trim());
function seedError(words) {
  for (let i = 0; i < words.length; i++) {
    if (!words[i]) return `Word ${i + 1} is empty.`;
    if (!/^[A-Za-z]{1,8}$/.test(words[i])) return `Word ${i + 1}: letters only, up to 8 letters.`;
  }
  return '';
}
function passHTML(n, confirm, hidden) {
  let h = '';
  for (let i = 0; i < n; i++) {
    h += `<div class="lbl">Passphrase${n > 1 ? ' ' + (i + 1) : ''}</div><div class="field"><input class="p ${hidden ? 'hide' : ''}" data-i="${i}" maxlength="20" ${INP} aria-label="Passphrase ${i + 1}"></div>`;
    if (confirm) h += `<div class="field"><input class="pc ${hidden ? 'hide' : ''}" data-i="${i}" maxlength="20" ${INP} placeholder="Confirm" aria-label="Confirm passphrase ${i + 1}"></div>`;

// Runs one stage check with failure counting. Wrong answer: back to step 1 (or lockout).
async function verify(check, last) {
  const id = L.id, v = L.v, n = L.n;
  const l = await beginCheck(id);
  if (!l) return lockedView(id), false;
  const b = busy('Verifying…');
  let ok = false;
  try { ok = await check(v); } catch { ok = false; }
  b.close();
  let r = null;
  if (ok) { if (last) await resetFails(id); else await passCheck(l); }
  else r = await failCheck(l);
  if (!gateOK && !recovering) { L = null; home(); return false; }   // app was left mid-check
  if (ok) return true;
  if (r.until > Date.now()) { L = null; lockedView(id); return false; }
  const left = MAX_FAILS - r.fails;
  L = { id, v, n, pc: 1, words: [], ps: [], cs: [], msg: `Incorrect. ${left} attempt${left === 1 ? '' : 's'} left before a 60-minute lock.` };
  loginSeed();
  return false;
}

/* ============ Secret login ============ */
const GATE_ITER = 60000, GATE_MIN = 3, GATE_MAX = 13;
let recovering = false;
let gateOK = false, gateRec = null, gateBuf = [], gateQ = Promise.resolve(), gateGen = 0;
async function gateHash(seq, salt) {
  const k = await crypto.subtle.importKey('raw', enc.encode('gate|' + seq.join(',')), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: GATE_ITER }, k, 256));
}
// Silent check: keeps the last N taps and compares them. Wrong order shows nothing at all.
function gateTap(v) {
  if (!gateRec || gateOK) return;
  gateBuf.push(v); if (gateBuf.length > gateRec.n) gateBuf.shift();
  if (gateBuf.length < gateRec.n) return;
  const attempt = gateBuf.slice(), gen = gateGen;
  gateQ = gateQ.then(async () => {
    if (gateOK || gen !== gateGen) return;
    if (same(await gateHash(attempt, gateRec.salt), gateRec.h) && gen === gateGen) {
      gateOK = true; gateBuf = []; const g = $('#gateLight'); if (g) g.classList.add('on');
    }
  }).catch(() => { });
}
function gateReset() { gateOK = false; gateBuf = []; gateGen++; const g = $('#gateLight'); if (g) g.classList.remove('on'); }
function gateGrid() { return `<div class="grid" style="margin-top:14px">${Array.from({ length: VAULTS }, (_, i) => `<button class="vault" data-v="${i + 1}" aria-label="Vault ${i + 1}">${VAULT_SVG}<span>Vault ${i + 1}</span></button>`).join('')}</div>`; }
function flash(b) { b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 260); }

/* ============ Vault ============ */
let urls = [];
const aadM = (v, id) => `m|${v}|${id}`, aadT = (v, id) => `t|${v}|${id}`, aadC = (v, id, k) => `c|${v}|${id}|${k}`;
async function enterVault(id, key) {
  if (recovering) { recovering = false; return gateCreate([], true); }   // keys proven: set a new secret login
  if (!gateOK) return home();
  session = { id, key, tab: 'media', items: [] };
  lastAct = Date.now();
  const b = busy('Opening…');
  try {
    const raw = await itemsOf(id);
    for (const it of raw) {
      try {
        const meta = JSON.parse(new TextDecoder().decode(await unseal(key, it.miv, it.mc, aadM(id, it.id))));
        let thumb = null;
        if (it.tc) { const t = await unseal(key, it.tiv, it.tc, aadT(id, it.id)); thumb = URL.createObjectURL(new Blob([t], { type: 'image/jpeg' })); urls.push(thumb); }
        session.items.push({ id: it.id, n: it.n, meta, thumb });
      } catch { /* unreadable record skipped */ }
    }
  } finally { b.close(); }
  vaultView();
}
function lockSession() {
  if (!session) return;
  session = null;
  urls.forEach(u => URL.revokeObjectURL(u)); urls = [];
  $$('.overlay,.modal,.busy').forEach(x => x.remove());
  home();
}

  } else if (s.tab === 'file') {
    body = `<button class="add" id="add">+ Add documents</button>` + (list.length ? `<div class="list">${list.map(i => `<button class="it" data-id="${i.id}">${FILE}<div class="nm"><div>${esc(i.meta.name)}</div><div class="meta">${fmtSize(i.meta.size)} · ${fmtDate(i.meta.created)}</div></div></button>`).join('')}</div>` : '<div class="empty">No documents yet.</div>');
  } else {
    body = `<button class="add" id="add">+ New note</button>` + (list.length ? `<div class="list">${list.map(i => `<button class="it" data-id="${i.id}">${NOTE}<div class="nm"><div>${esc(i.meta.title || 'Untitled')}</div><div class="meta">${fmtDate(i.meta.updated || i.meta.created)}</div></div></button>`).join('')}</div>` : '<div class="empty">No notes yet.</div>');
  }
  view(`<div class="top"><button class="icon-btn" id="lock" aria-label="Lock vault">${LOCK}</button><div class="step">Vault ${s.id}</div><button class="icon-btn" id="more" aria-label="Vault options">${MORE}</button></div>
  <div class="tabs">${[['media', 'Media'], ['file', 'Documents'], ['note', 'Notes']].map(([k, t]) => `<button data-t="${k}" class="${s.tab === k ? 'on' : ''}">${t}</button>`).join('')}</div>${body}`);
  $('#lock').onclick = lockSession;
  $('#more').onclick = vaultMenu;
  $$('.tabs button').forEach(b => b.onclick = () => { s.tab = b.dataset.t; vaultView(); });
  $('#add').onclick = () => {
    if (s.tab === 'note') return noteEditor(null);
    picking = true; (s.tab === 'media' ? $('#pickMedia') : $('#pickFiles')).click();
  };
  $$('[data-id]').forEach(b => b.onclick = () => { const it = s.items.find(x => x.id === b.dataset.id); s.tab === 'note' ? noteEditor(it) : viewer(it); });
}

/* ---- Uploads ---- */
async function makeThumb(file) {
  const draw = (src, w, h) => { const c = document.createElement('canvas'); const r = Math.min(1, 360 / Math.max(w, h)); c.width = Math.round(w * r); c.height = Math.round(h * r); c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); return new Promise(res => c.toBlob(res, 'image/jpeg', .72)); };
  try {
    if (file.type.startsWith('image/')) {
      const url = URL.createObjectURL(file);
      try { const img = new Image(); img.src = url; await img.decode(); return await draw(img, img.naturalWidth, img.naturalHeight); } finally { URL.revokeObjectURL(url); }
    }
    if (file.type.startsWith('video/')) {
      const url = URL.createObjectURL(file);
      try {
        const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
        await new Promise((res, rej) => { const t = setTimeout(() => rej(new Error('timeout')), 6000); v.onloadeddata = () => { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); }; v.onseeked = () => { clearTimeout(t); res(); }; v.onerror = () => { clearTimeout(t); rej(new Error('video')); }; });
        return await draw(v, v.videoWidth, v.videoHeight);
      } finally { URL.revokeObjectURL(url); }
    }
  } catch { }
  return null;
}
async function addFiles(files, kind) {
  const s = session; if (!s || !files.length) return;
  busyFlag = true;
  const b = busy('Encrypting…');
  let failed = 0;
  try {
    for (let f = 0; f < files.length; f++) {
      if (session !== s) break;
      const file = files[f], id = uid(), n = Math.max(1, Math.ceil(file.size / CHUNK));
      try {
        for (let k = 0; k < n; k++) {
          b.set(`Encrypting ${f + 1} of ${files.length}` + (n > 1 ? ` · ${Math.round(k / n * 100)}%` : ''));
          const part = new Uint8Array(await file.slice(k * CHUNK, (k + 1) * CHUNK).arrayBuffer());
          const sealed = await seal(s.key, part, aadC(s.id, id, k)); part.fill(0);
          await put('chunks', { item: id, n: k, iv: sealed.iv, c: sealed.c });
        }
        const meta = { kind, name: file.name || 'file', type: file.type || '', size: file.size, created: Date.now() };
        const m = await seal(s.key, enc.encode(JSON.stringify(meta)), aadM(s.id, id));
        const rec = { id, vault: s.id, n, miv: m.iv, mc: m.c };
        let thumb = null;
        if (kind === 'media') {
          const tb = await makeThumb(file);
          if (tb) { const t = await seal(s.key, new Uint8Array(await tb.arrayBuffer()), aadT(s.id, id)); rec.tiv = t.iv; rec.tc = t.c; thumb = URL.createObjectURL(tb); urls.push(thumb); }
        }
        await put('items', rec);
        s.items.push({ id, n, meta, thumb });
      } catch (e) { failed++; try { await delItem(id); } catch { } }
    }
  } finally { b.close(); busyFlag = false; lastAct = Date.now(); }
  if (session === s) { vaultView(); if (failed) modal(`<p>${failed} item${failed > 1 ? 's' : ''} could not be saved. Your iPhone may be out of space for Nella.</p><button class="btn" onclick="this.closest('.modal').remove()">OK</button>`); }
}
$('#pickMedia').onchange = e => { picking = false; const f = [...e.target.files]; e.target.value = ''; addFiles(f, 'media'); };
$('#pickFiles').onchange = e => { picking = false; const f = [...e.target.files]; e.target.value = ''; addFiles(f, 'file'); };

async function readBlob(it) {
  const s = session, parts = [];
  for (let k = 0; k < it.n; k++) { const ch = await get('chunks', [it.id, k]); parts.push(await unseal(s.key, ch.iv, ch.c, aadC(s.id, it.id, k))); }
  return new Blob(parts, { type: it.meta.type || 'application/octet-stream' });
}

/* ---- Viewer ---- */
async function viewer(it) {
  const s = session;
  const b = busy('Decrypting…'); let blob;
  try { blob = await readBlob(it); } catch { b.close(); return; }
  b.close(); if (session !== s) return;
  const url = URL.createObjectURL(blob); urls.push(url);
  const t = it.meta.type || '';
  let inner;
  if (t.startsWith('image/')) inner = `<img src="${url}" alt="">`;
  else if (t.startsWith('video/')) inner = `<video src="${url}" controls playsinline></video>`;
  else if (t === 'application/pdf' || t.startsWith('text/')) inner = `<iframe src="${url}" sandbox title="Document"></iframe>`;
  else inner = `<div class="center" style="padding:30px">${FILE.replace('<svg', '<svg style="width:56px;height:56px"')}<p>${esc(it.meta.name)}</p><p class="sub">${fmtSize(it.meta.size)}<br>Preview isn't available for this file type. Use Share to open it in another app.</p></div>`;
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="bar"><button class="txt-btn" id="vClose">Close</button><div class="t">${esc(it.meta.name)}</div><button class="txt-btn" id="vMore">More</button></div><div class="body">${inner}</div>`;
  document.body.appendChild(o);
  const close = () => { o.remove(); URL.revokeObjectURL(url); };
  o.querySelector('#vClose').onclick = close;
  o.querySelector('#vMore').onclick = () => {
    const m = modal(`<button class="btn" data-a="share">Share / Save to…</button><button class="btn ghost" data-a="del">Delete from vault</button><button class="btn ghost" data-a="x">Cancel</button>`);
    m.onclick = async e => {
      const a = e.target.closest('[data-a]'); if (!a && e.target !== m) return; m.remove(); if (!a) return;
      if (a.dataset.a === 'share') {
        const file = new File([blob], it.meta.name, { type: t || 'application/octet-stream' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { picking = true; try { await navigator.share({ files: [file] }); } catch { } picking = false; }
        else { const l = document.createElement('a'); l.href = url; l.download = it.meta.name; l.click(); }
      }
      if (a.dataset.a === 'del' && await ask('Delete this item from the vault? This cannot be undone.', 'Delete')) {
        await delItem(it.id); session.items = session.items.filter(x => x.id !== it.id); close(); vaultView();
      }
    };
  };
}

/* ---- Notes ---- */
async function noteEditor(it) {
  const s = session; let body = '';
  if (it) { try { body = new TextDecoder().decode(await unseal(s.key, ...(await (async () => { const c = await get('chunks', [it.id, 0]); return [c.iv, c.c]; })()), aadC(s.id, it.id, 0))); } catch { return; } }
  if (session !== s) return;
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="bar"><button class="txt-btn" id="nDone">Done</button><div class="t"></div><button class="txt-btn" id="nDel">${it ? 'Delete' : ''}</button></div>
  <input class="note-t" id="nT" placeholder="Title" maxlength="120" ${INP}><textarea class="note-b" id="nB" placeholder="Write a note…" autocapitalize="sentences"></textarea>`;
  document.body.appendChild(o);
  const T = o.querySelector('#nT'), B = o.querySelector('#nB');
  T.value = it ? (it.meta.title || '') : ''; B.value = body;
  if (!it) T.focus();
  o.querySelector('#nDone').onclick = async () => {
    const title = T.value.trim(), text = B.value;
    if (!it && !title && !text.trim()) { o.remove(); return; }
    const id = it ? it.id : uid(), now = Date.now();
    const meta = { kind: 'note', name: title || 'Untitled', title, type: 'text/plain', size: enc.encode(text).length, created: it ? it.meta.created : now, updated: now };
    const c = await seal(s.key, enc.encode(text), aadC(s.id, id, 0));
    const m = await seal(s.key, enc.encode(JSON.stringify(meta)), aadM(s.id, id));
    await put('chunks', { item: id, n: 0, iv: c.iv, c: c.c });
    await put('items', { id, vault: s.id, n: 1, miv: m.iv, mc: m.c });
    if (it) it.meta = meta; else s.items.push({ id, n: 1, meta, thumb: null });
    o.remove(); if (session === s) vaultView();
  };
  if (it) o.querySelector('#nDel').onclick = async () => {
    if (!await ask('Delete this note? This cannot be undone.', 'Delete')) return;
    await delItem(it.id); s.items = s.items.filter(x => x.id !== it.id); o.remove(); vaultView();
  };
}

/* ---- Vault menu ---- */
async function vaultMenu() {
  let used = '';
  try { const e = await navigator.storage.estimate(); used = `Nella storage: ${fmtSize(e.usage || 0)} used of ${fmtSize(e.quota || 0)} available`; } catch { }
  const s = session;
  const m = modal(`<p style="color:#888;font-size:13px">${esc(used)}</p><button class="btn ghost" data-a="backup">Export encrypted backup</button><button class="btn ghost" data-a="erase">Erase this vault</button><button class="btn" data-a="x">Close</button>`);
  m.onclick = async e => {
    const a = e.target.closest('[data-a]'); if (!a && e.target !== m) return; m.remove();
    if (a && a.dataset.a === 'backup') return exportBackup();
    if (!a || a.dataset.a !== 'erase') return;
    const c = modal(`<p>Erase Vault ${s.id}? Everything inside and its three keys are deleted permanently. Type ERASE to confirm.</p><div class="field"><input id="eIn" ${INP} autocapitalize="characters"></div><button class="btn" id="eGo">Erase vault</button><button class="btn ghost" id="eNo">Cancel</button>`);
    c.querySelector('#eNo').onclick = () => c.remove();
    c.querySelector('#eGo').onclick = async () => {
      if (c.querySelector('#eIn').value.trim() !== 'ERASE') return;
      c.remove(); const b = busy('Erasing…');
      for (const it of await itemsOf(s.id)) await delItem(it.id);
      await del('vaults', s.id); await del('locks', s.id);
      b.close(); lockSession();
    };
  };
}

/* ============ Encrypted backup ============ */
// File layout: "NELLABK1" | header length (4 bytes) | header JSON | per chunk: iv (12) | length (4) | ciphertext.
// Everything sensitive inside is already encrypted with the vault key, which only the vault's 3 steps unlock.
const MAGIC = 'NELLABK1';
let restoreTarget = 0;
const b64 = u => { const a = new Uint8Array(u); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const u32 = n => { const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, n); return b; };
function note(msg) { const m = modal(`<p>${esc(msg)}</p><button class="btn" data-a="ok">OK</button>`); return new Promise(r => { m.onclick = e => { if (e.target.closest('[data-a]') || e.target === m) { m.remove(); r(); } }; }); }

async function buildBackup(id) {
  const v = await get('vaults', id); if (!v) throw new Error('no vault');
  const items = await itemsOf(id);
  const head = {
    app: 'nella', ver: 1, vault: id, created: Date.now(),
    v: { ver: v.ver, salt: b64(v.salt), v1: b64(v.v1), v2: b64(v.v2), wiv: b64(v.wiv), wc: b64(v.wc), created: v.created },
    items: items.map(it => ({ id: it.id, n: it.n, miv: b64(it.miv), mc: b64(it.mc), tiv: it.tc ? b64(it.tiv) : null, tc: it.tc ? b64(it.tc) : null }))
  };
  const hj = enc.encode(JSON.stringify(head));
  const parts = [enc.encode(MAGIC), u32(hj.length), hj];
  for (const it of items) for (let k = 0; k < it.n; k++) {
    const ch = await get('chunks', [it.id, k]); if (!ch) throw new Error('missing chunk');
    parts.push(new Uint8Array(ch.iv), u32(ch.c.byteLength), new Uint8Array(ch.c));
  }
  return new Blob(parts, { type: 'application/octet-stream' });
}
async function exportBackup() {
  const s = session; if (!s) return;
  const b = busy('Preparing backup…'); busyFlag = true;
  let blob;
  try { blob = await buildBackup(s.id); } catch { b.close(); busyFlag = false; return note('Backup failed. Nothing was saved.'); }
  b.close(); busyFlag = false; lastAct = Date.now();
  const d = new Date(), day = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const name = `Nella-Vault-${s.id}-${day}.nella`;
  const file = new File([blob], name, { type: 'application/octet-stream' });
  const m = modal(`<p>Backup of Vault ${s.id} is ready (${fmtSize(blob.size)}).</p><p class="sub" style="margin:0 0 6px">Tap Save, then choose “Save to Files”. Keep a second copy off this iPhone, like a USB drive. It only opens with this vault's 3 steps.</p><button class="btn" id="bSave">Save</button><button class="btn ghost" id="bNo">Cancel</button>`);
  m.querySelector('#bNo').onclick = () => m.remove();
  m.querySelector('#bSave').onclick = async () => {
    m.remove();
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      picking = true; try { await navigator.share({ files: [file], title: name }); } catch { } picking = false;
    } else {
      const u = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 120000);
    }
  };
}
async function readBackupHead(file) {
  const rd = async (o, n) => new Uint8Array(await file.slice(o, o + n).arrayBuffer());
  if (file.size < 12) throw new Error('bad');
  if (new TextDecoder().decode(await rd(0, 8)) !== MAGIC) throw new Error('bad');
  const hl = new DataView((await rd(8, 4)).buffer).getUint32(0);
  if (!hl || 12 + hl > file.size || hl > 256 * 1024 * 1024) throw new Error('bad');
  const head = JSON.parse(new TextDecoder().decode(await rd(12, hl)));
  if (head.app !== 'nella' || head.ver !== 1 || !Number.isInteger(head.vault) || head.vault < 1 || head.vault > VAULTS || !head.v || !Array.isArray(head.items)) throw new Error('bad');
  for (const it of head.items) if (!/^[0-9a-f]{32}$/.test(it.id) || !Number.isInteger(it.n) || it.n < 1) throw new Error('bad');
  // Walk the chunk table to make sure the file is complete before touching storage
  let off = 12 + hl;
  for (const it of head.items) for (let k = 0; k < it.n; k++) {
    if (off + 16 > file.size) throw new Error('bad');
    const len = new DataView((await rd(off + 12, 4)).buffer).getUint32(0);
    off += 16 + len; if (off > file.size) throw new Error('bad');
  }
  if (off !== file.size) throw new Error('bad');
  return { head, start: 12 + hl };
}
async function writeBackup(file, head, start) {
  const id = head.vault, rd = async (o, n) => new Uint8Array(await file.slice(o, o + n).arrayBuffer());
  const done = []; let off = start;
  try {
    for (const it of head.items) {
      done.push(it.id);
      for (let k = 0; k < it.n; k++) {
        const iv = await rd(off, 12), len = new DataView((await rd(off + 12, 4)).buffer).getUint32(0);
        const c = await rd(off + 16, len); off += 16 + len;
        await put('chunks', { item: it.id, n: k, iv, c });
      }
      const rec = { id: it.id, vault: id, n: it.n, miv: unb64(it.miv), mc: unb64(it.mc) };
      if (it.tc) { rec.tiv = unb64(it.tiv); rec.tc = unb64(it.tc); }
      await put('items', rec);
    }
    const v = head.v;
    await put('vaults', { id, ver: v.ver, salt: unb64(v.salt), v1: unb64(v.v1), v2: unb64(v.v2), wiv: unb64(v.wiv), wc: unb64(v.wc), created: v.created });
    await resetFails(id);
  } catch (e) {
    for (const x of done) { try { await delItem(x); } catch { } }
    try { await del('vaults', id); } catch { }
    throw e;
  }
}
async function restoreFile(file) {
  const target = restoreTarget; restoreTarget = 0;
  if (!file || !gateOK) return;
  const b = busy('Checking backup…');
  let parsed;
  try { parsed = await readBackupHead(file); } catch { b.close(); return note('This file is not a Nella backup, or it is incomplete or damaged. Nothing was changed.'); }
  b.close();
  const n = parsed.head.vault;
  if (await get('vaults', n)) return note(`This backup is for Vault ${n}, which is already set up. To restore it, open Vault ${n}, erase it, then restore.`);
  if (n !== target && !(await ask(`This backup is for Vault ${n}. Restore it into Vault ${n}?`, 'Restore'))) return;
  const b2 = busy('Restoring…'); busyFlag = true;
  try { await writeBackup(file, parsed.head, parsed.start); }
  catch { b2.close(); busyFlag = false; return note('Restore failed. Your iPhone may be out of space. Nothing was changed.'); }
  b2.close(); busyFlag = false; lastAct = Date.now();
  home();
  note(`Vault ${n} restored. Open it with its 3 steps.`);
}
$('#pickBackup').onchange = e => { picking = false; const f = e.target.files[0]; e.target.value = ''; restoreFile(f); };

/* ============ Auto-lock ============ */
let picking = false, busyFlag = false, lastAct = Date.now();
['pointerdown', 'keydown', 'input'].forEach(ev => document.addEventListener(ev, () => { lastAct = Date.now(); }, true));
function leaveApp() {
  if (!gateRec) return;                       // still creating the secret login
  recovering = false;
  gateReset();
  if (session) return lockSession();
  $$('.overlay,.modal,.busy').forEach(x => x.remove());
  home();
}
document.addEventListener('visibilitychange', () => { if (document.hidden && !picking && !busyFlag) leaveApp(); if (!document.hidden) picking = false; });
window.addEventListener('pagehide', leaveApp);
setInterval(() => {
  if (!busyFlag && Date.now() - lastAct > IDLE_MS && (session || gateOK || L || S)) leaveApp();
  clockCheck().catch(() => { });
}, 15000);

/* ============ Start ============ */
if ('serviceWorker' in navigator && location.protocol === 'https:' || location.hostname === 'localhost') {
  navigator.serviceWorker && navigator.serviceWorker.register('./sw.js').catch(() => { });
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
clockCheck().catch(() => { }).finally(async () => {
  try { gateRec = (await get('sys', 'gate')) || null; } catch { gateRec = null; }
  gateRec ? home() : gateIntro();
});
</script>
